<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Athly</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="events.css">
</head>
<body>

    <nav class="navbar">
        <div class="navContainer">
            
            <a href="index.html" class="brandLink">
                <div class="brandLogoBox">
                    <div class="brandLogoDot"></div>
                </div>
                <span class="brandName">Athly</span>
            </a>

            <div class="navLinks">
                <a href="events.html" class="navItem">Discover</a>
                <a href="community.html" class="navItem">Community</a>
                <a href="dashboard.html" class="navItem">Organizers</a>
            </div>

            <div class="authGroup">
                <button class="btnLogin" onclick="window.location.href='login.html'">Log in</button>
                <button class="btnSignup" onclick="window.location.href='login.html?mode=signup'" id="auth-btn">Sign Up</button>
            </div>

        </div>
    </nav>

    <div class="mainContainer">
        
        <div class="searchSection">
            <div class="searchBarWrapper">
                <svg class="searchIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="11" cy="11" r="8"/>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"/>
                </svg>
                <input type="text" placeholder="Search events (e.g., 'Pickleball in Chicago')" class="searchInput">
                <button class="btnFind">Find</button>
            </div>
        </div>

        <div class="filterBar">
            <div class="filterField">
                <label for="Relevance">Relevance</label>
                <select id="Relevance" class="filterSelect">
                    <option value="None">All</option>
                    <option value="Most Popular">Most Popular</option>
                </select>
            </div>

            <div class="filterField">
                <label for="Organizer">Organizer</label>
                <select id="Organizer" class="filterSelect">
                    <option value="None">All</option>
                    <option value="Red Bull">Red Bull</option>
                    <option value="Local Clubs">Local Clubs</option>
                    <option value="Indie Orgs">Indie Orgs</option>
                    <option value="Verified">Verified</option>
                </select>
            </div>
            <div class="filterField">
                <label for="Difficulty">Difficulty</label>
                <select id="Difficulty" class="filterSelect">
                    <option value="None">All</option>
                    <option value="Beginner">Beginner</option>
                    <option value="Intermediate">Intermediate</option>
                    <option value="Pro / Elite">Pro / Elite</option>
                </select>
            </div>
            <div class="filterField">
                <label for="Distance">Distance</label>
                <select id="Distance" class="filterSelect">
                    <option value="None">All</option>
                    <option value="< 5 Miles">&lt; 5 Miles</option>
                    <option value="< 20 Miles">&lt; 20 Miles</option>
                    <option value="< 50 Miles">&lt; 50 Miles</option>
                    <option value="Anywhere">Anywhere</option>
                </select>
            </div>

            <div class="filterField">
                <label for="Location">Location</label>
                <select id="Location" class="filterSelect">
                    <option value="None">All</option>
                    <option value="Maharashtra">Maharashtra</option>
                    <option value="Punjab">Punjab</option>
                    <option value="Gujrat">Gujrat</option>
                    <option value="Goa">Goa</option>
                </select>
            </div>

            <div class="filterField">
                <label for="Type">Type</label>
                <select id="Type" class="filterSelect">
                    <option value="None">All</option>
                    <option value="Marathon">Marathon</option>
                    <option value="Triathlon">Triathlon</option>
                    <option value="Cycling">Cycling</option>
                    <option value="Swimming">Swimming</option>
                </select>
            </div>
        </div>

        <div class="cardList" id="eventsContainer">
            <div class="pagination">
                <span class="pageNum active">1</span>
                <span class="pageNum">2</span>
                <span class="pageDots">...</span>
                <span class="pageNum">MAX</span>
                <span class="pageArrow">&gt;</span>
            </div>
            <div class="card">
                <img src="Assets/CycleSlideIn.png" alt="" class="cardBgIcon">

                <div class="cardLeftCol">
                    <div class="cardIcon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                            <path d="M3 12h18M3 6h18M3 18h18"/>
                        </svg>
                    </div>
                    <div class="meterWrapper">
                        <div class="difficultyMeter diff-med">
                            <span class="difficultyText">Moderate</span>
                        </div>
                    </div>
                </div>

                <div class="cardContent">
                    <div class="cardHeader">
                        <a href="#" class="cardTitle">City Midnight Ride</a>
                        <span class="cardAuthor">by <a href="#">NightRides</a></span>
                    </div>
                    <p class="cardDesc">A city ride at night</p>
                    <div class="cardTags">
                        <img src="Assets/CycleIcon.svg" alt="Description" width="30" height="30" class="svgTagcycle" title="Cycling">
                    </div>
                </div>

                <div class="cardStats">
                    <div class="statRow">
                        <svg class="statIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="4" ry="4"/><path d="M8 12l3 3 5-5"/></svg>
                        <span>5199</span>
                    </div>
                    <div class="statRow updateInfo">
                        <svg class="statIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                        <span>Updated 5 days ago</span>
                    </div>
                </div>
            </div>
            
            <div class="card">
                <img src="Assets/RunningSlideIn.png" alt="" class="cardBgIcon" style="left: 400px">

                <div class="cardLeftCol">
                    <div class="cardIcon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                            <circle cx="12" cy="12" r="10"/>
                            <path d="M14.31 8l5.74 9.94M9.69 8h11.48M7.38 12l5.74-9.94M9.69 16L3.95 6.06M14.31 16H2.83M16.62 12l-5.74 9.94"/>
                        </svg>
                    </div>
                    <div class="meterWrapper">
                        <div class="difficultyMeter diff-hard">
                            <span class="difficultyText">Expert</span>
                        </div>
                    </div>
                </div>

                <div class="cardContent">
                    <div class="cardHeader">
                        <a href="#" class="cardTitle">Mountain Trail</a>
                        <span class="cardAuthor">by <a href="#">TrailMaster</a></span>
                    </div>
                    <p class="cardDesc">A simple example of a longer description ?</p>
                    <div class="cardTags">
                        <img src="Assets/RunningIcon.svg" alt="Description" width="27" height="27" class="svgTag" title="Running">
                    </div>
                </div>

                <div class="cardStats">
                    <div class="statRow">
                        <svg class="statIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="4" ry="4"/><path d="M8 12l3 3 5-5"/></svg>
                        <span>30.1K</span>
                    </div>
                    <div class="statRow updateInfo">
                        <svg class="statIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                        <span>Updated last month</span>
                    </div>
                </div>
            </div>
        </div>
        
        <div id="ai-chat" class="collapsed">
            <button class="chat-toggle">Athly Assistant</button>

            <div class="chat-panel">
                <div class="chat-header">
                    <span>Athly Assistant</span>
                    <button class="chat-close">Close</button>
                </div>

                <div id="chat-body" class="chat-content"></div>

                <div class="chat-input-area">
                    <textarea id="chat-input" placeholder="Type here...&#10;eg: List all events on 8th Feb"></textarea>
                    <button id="chat-send">Send</button>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const dropdowns = document.querySelectorAll('.sortDropdownWrapper');

            dropdowns.forEach(dropdown => {
                const btn = dropdown.querySelector('.sortBtn');
                
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    
                    //closes other dropdowns before opening current
                    dropdowns.forEach(other => {
                        if (other !== dropdown) {
                            other.classList.remove('active');
                        }
                    });

                    dropdown.classList.toggle('active');
                });
            });

            //closes dropdown when clicking elsewhere on page
            document.addEventListener('click', () => {
                dropdowns.forEach(dropdown => {
                    dropdown.classList.remove('active');
                });
            });
        });
    </script>
    <script type="module" src="events.js"></script>
</body>
</html>
