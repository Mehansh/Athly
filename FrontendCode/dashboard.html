<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Organizer Dashboard</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-body: #09090b;
            --bg-card: #1a1a1a;
            --bg-hover: #1f1f22;
            --border-color: #27272a;
            --text-main: #fafafa;
            --text-muted: #a1a1aa;
            --text-dim: #52525b;
            --accent-green: #4ade80;
            --bg-green-dim: rgba(74, 222, 128, 0.1);
            --font-family: 'Inter', sans-serif;

            --colBg: #09090b;
            --colCardBg: #111111;
            --colBorder: #27272a;
            --colBorderLight: #3f3f46;

            --colTextMain: #ffffff;
            --colTextSec: #a1a1aa;
            --colTextMuted: #71717a;

            --colInputBg: #1a1a1a;
            --colAccent: #ffffff;
            --colGlow: #4f46e5;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-main);
            font-family: var(--font-family);
            line-height: 1.5;
            min-height: 100vh;
        }

        .navItem_active {
            color: white;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        button {
            background: none;
            border: none;
            cursor: pointer;
            font-family: inherit;
        }

        input,
        textarea {
            font-family: inherit;
        }

        /* --- Utility Classes --- */
        .container {
            max-width: 1280px;
            margin: 0 auto;
            padding: 0 24px;
        }

        .icon-placeholder {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background-color: #333;
            color: #888;
            font-size: 10px;
            border-radius: 4px;
            padding: 2px 4px;
            font-style: normal;
        }

        .hidden {
            display: none !important;
        }

        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 64px;
            background-color: #000;
            border-bottom: 1px solid var(--border-color);
            z-index: 100;
            display: flex;
            align-items: center;
        }

        .nav-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 700;
            font-size: 1.125rem;
        }

        .logo-box {
            width: 32px;
            height: 32px;
            background-color: white;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .logo-dot {
            width: 12px;
            height: 12px;
            background-color: black;
            border-radius: 50%;
        }

        .nav-links {
            display: none;
            gap: 32px;
            font-size: 0.875rem;
            font-weight: 500;
            color: var(--text-muted);
            position: absolute;
            margin-left: 475px;
        }

        .nav-links a:hover {
            color: white;
        }

        .nav-actions {
            display: flex;
            align-items: center;
            gap: 24px;
        }

        .btn-login {
            color: var(--text-muted);
            font-size: 0.875rem;
            font-weight: 500;
        }

        .btn-login:hover {
            color: white;
        }

        .btn-signup {
            background-color: var(--colBorder);
            border: 0px solid var(--colBorderLight);
            color: white;
            font-size: 14px;
            font-weight: 500;
            padding: 8px 16px;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.15s, box-shadow 0.2s;
            font-family: 'Inter', sans-serif;
        }

        .btn-signup:hover {
            box-shadow: 0 0 0 2px var(--colGlow), 0 0 15px rgba(79, 70, 229, 0.3);
        }

        /* --- Main Content Layout --- */
        .main-wrapper {
            max-width: 1024px;
            padding-top: 100px;
            /* Offset for fixed navbar */
            padding-bottom: 80px;
        }

        /* --- Header Section --- */
        .header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
        }

        .page-title {
            font-size: 1.875rem;
            font-weight: 700;
            margin-bottom: 8px;
            color: white;
        }

        .page-subtitle {
            color: var(--text-muted);
        }

        .btn-create {
            background-color: var(--colBorder);
            border: 0px solid var(--colBorderLight);
            color: white;
            font-size: 14px;
            font-weight: 500;
            padding: 8px 16px;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.15s, box-shadow 0.2s;
            font-family: 'Inter', sans-serif;
            margin-top: 40px;
        }

        .btn-create:hover {
            box-shadow: 0 0 0 2px var(--colGlow), 0 0 15px rgba(79, 70, 229, 0.3);
        }

        /* --- Modal / Create Form --- */
        .create-form-container {
            margin-bottom: 40px;
            animation: slideDown 0.3s ease-out;
        }

        .form-card {
            background-color: #1a1a1a;
            border: 0px solid #3f3f46;
            border-radius: 12px;
            padding: 24px;
        }

        .form-title {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 24px;
            color: white;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 24px;
            margin-bottom: 24px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .form-label {
            font-size: 0.875rem;
            color: var(--text-muted);
        }

        .form-input,
        .form-textarea {
            width: 100%;
            background-color: black;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 12px;
            color: white;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .form-input:focus,
        .form-textarea:focus {
            border-color: var(--text-dim);
        }

        .form-textarea {
            height: 96px;
            resize: none;
        }

        .magic-fill-btn {
            font-size: 0.75rem;
            color: #60a5fa;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .magic-fill-btn:hover {
            color: #93c5fd;
        }

        .magic-fill-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .form-actions {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
        }

        .btn-cancel {
            padding: 8px 16px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            color: white;
            font-size: 0.875rem;
        }

        .btn-cancel:hover {
            background-color: var(--border-color);
        }

        .btn-submit {
            padding: 8px 16px;
            border-radius: 8px;
            background-color: white;
            color: black;
            font-size: 0.875rem;
            font-weight: 500;
        }

        .btn-submit:hover {
            background-color: #e4e4e7;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 24px;
            margin-bottom: 40px;
        }

        .stat-card {
            background-color: var(--bg-card);
            border: 0px solid var(--border-color);
            border-radius: 5px;
            padding: 24px;
            transition: box-shadow 0.2s;
        }

        .stat-card:hover {
            box-shadow: 0 0 0 2px var(--colGlow), 0 0 15px rgba(79, 70, 229, 0.3);
        }

        .stat-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 16px;
        }

        .icon-box {
            padding: 8px;
            background-color: #18181b;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .stat-badge {
            font-size: 0.75rem;
            font-weight: 500;
            color: var(--accent-green);
            background-color: var(--bg-green-dim);
            padding: 4px 8px;
            border-radius: 9999px;
        }

        .stat-value {
            font-size: 1.5rem;
            font-weight: 700;
            color: white;
            margin-bottom: 4px;
        }

        .stat-label {
            font-size: 0.875rem;
            color: var(--text-dim);
        }

        .section-title {
            font-size: 1.25rem;
            font-weight: 700;
            margin-bottom: 24px;
            color: white;
        }

        .events-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .event-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px;
            background-color: rgba(24, 24, 27, 0.2);
            border: 1px solid rgba(39, 39, 42, 0.5);
            border-radius: 8px;
            transition: all 0.2s;
        }

        .event-item:hover {
            border-color: #3f3f46;
        }

        .event-info {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
        }

        .dot-red {
            background-color: #ef4444;
        }

        .dot-green {
            background-color: #22c55e;
        }

        .event-details h4 {
            color: white;
            font-weight: 500;
            margin-bottom: 4px;
        }

        .event-details div {
            font-size: 0.75rem;
            color: var(--text-dim);
        }

        .event-stats {
            display: flex;
            align-items: center;
            gap: 32px;
        }

        .progress-wrapper {
            text-align: right;
            display: none;
        }

        /* Hidden on mobile by default */
        .progress-text {
            font-size: 0.875rem;
            color: #d4d4d8;
        }

        .progress-label {
            font-size: 10px;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .progress-bar {
            width: 96px;
            height: 6px;
            background-color: var(--border-color);
            border-radius: 9999px;
            overflow: hidden;
            display: none;
        }

        .progress-fill {
            height: 100%;
            background-color: white;
        }

        .btn-manage {
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 500;
            border: 1px solid var(--border-color);
            color: white;
            transition: background-color 0.2s;
        }

        .btn-manage:hover {
            background-color: var(--border-color);
        }

        /* --- Media Queries --- */
        @media (min-width: 768px) {
            .nav-links {
                display: flex;
            }

            .form-grid {
                grid-template-columns: 1fr 1fr;
            }

            .full-width-col {
                grid-column: span 2;
            }

            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .progress-wrapper,
            .progress-bar {
                display: block;
            }
        }

        @media (min-width: 1024px) {
            .stats-grid {
                grid-template-columns: repeat(4, 1fr);
            }
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body>

    <nav class="navbar">
        <div class="container nav-content">
            <a href="index.html" class="logo">
                <div class="logo-box">
                    <div class="logo-dot"></div>
                </div>
                <span>Athly</span>
            </a>

            <div class="nav-links">
                <a href="events.html">Discover</a>
                <a href="community.html">Community</a>
                <a href="dashboard.html">
                    <div class="navItem_active">Organizers</div>
                </a>
            </div>

            <div class="nav-actions">
                <button class="btn-login">Log in</button>
                <button class="btn-signup">Sign Up</button>
            </div>
        </div>
    </nav>

    <div class="container main-wrapper">

        <div class="header-row">
            <div>
                <h1 class="page-title">Organizer Dashboard</h1>
                <p class="page-subtitle">Manage your leagues, tournaments, and participants.</p>
            </div>
            <button onclick="window.location.href='add_event.html'" id="create-btn" class="btn-create">
                Create New Event
            </button>
        </div>

        <div id="create-modal" class="create-form-container hidden">
            <div class="form-card">
                <h2 class="form-title">Create New Tournament</h2>

                <div class="form-grid">
                    <div class="form-group">
                        <label class="form-label">Event Title</label>
                        <input type="text" id="event-title" placeholder="e.g. Summer Slam 2024" class="form-input"
                            oninput="checkMagicFill()">
                    </div>

                    <div class="form-group">
                        <label class="form-label">Sport</label>
                        <input type="text" id="event-sport" placeholder="e.g. Drone Racing" class="form-input"
                            oninput="checkMagicFill()">
                    </div>

                    <div class="form-group full-width-col">
                        <div style="display: flex; justify-content: space-between;">
                            <label class="form-label">Description</label>
                            <button id="magic-fill-btn" onclick="handleMagicFill()" disabled class="magic-fill-btn">
                                <span class="icon-placeholder" id="magic-icon">[Sparkles]</span>
                                AI Magic Fill
                            </button>
                        </div>
                        <textarea id="event-desc" placeholder="Describe your event..." class="form-textarea"></textarea>
                    </div>

                    <div style="display: flex; gap: 1rem; grid-column: 1 / -1;">
                        <div class="form-group" style="flex: 1;">
                            <label class="form-label">Date</label>
                            <input type="date" class="form-input" style="color-scheme: dark;">
                        </div>
                        <div class="form-group" style="flex: 1;">
                            <label class="form-label">Distance</label>
                            <input type="text" placeholder="e.g. 5km" class="form-input">
                        </div>
                    </div>

                    <div class="form-group full-width-col">
                        <label class="form-label">Venue / Location</label>
                        <input type="text" class="form-input">
                    </div>

                    <div style="display: flex; gap: 1rem; grid-column: 1 / -1;">
                        <div class="form-group" style="flex: 1;">
                            <label class="form-label">City</label>
                            <input type="text" class="form-input">
                        </div>
                        <div class="form-group" style="flex: 1;">
                            <label class="form-label">State</label>
                            <input type="text" class="form-input">
                        </div>
                    </div>
                </div>

                <div class="form-actions">
                    <button onclick="toggleModal()" class="btn-cancel">Cancel</button>
                    <button class="btn-submit">Publish Event</button>
                </div>
            </div>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-header">
                    <div class="icon-box">
                        <img src="./icons/users.svg" alt="Users">
                    </div>
                </div>
                <div class="stat-value" id="stat-participants">0</div>
                <div class="stat-label">Total Participants</div>
            </div>

            <div class="stat-card">
                <div class="stat-header">
                    <div class="icon-box">
                        <img src=" ./icons/calendar.svg" alt="Calendar">
                    </div>
                </div>
                <div class="stat-value" id="stat-events">0</div>
                <div class="stat-label">Active Events</div>
            </div>

            <div class="stat-card">
                <div class="stat-header">
                    <div class="icon-box">
                        <img src="./icons/dollar-sign.svg" alt="Dollar">
                    </div>
                </div>
                <div class="stat-value" id="stat-revenue">₹0</div>
                <div class="stat-label">Revenue</div>
            </div>

            <div class="stat-card">
                <div class="stat-header">
                    <div class="icon-box">
                        <img src="./icons/trending-up.svg" alt="Trend">
                    </div>
                </div>
                <div class="stat-value" id="stat-clicks">0</div>
                <div class="stat-label">Event Clicks</div>
            </div>
        </div>

        <h2 class="section-title">Your Events</h2>

        <div class="events-list" id="events-container">
            <div style="text-align:center; padding: 20px; color:#71717a">Loading events...</div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, getDoc, collection, query, where, getDocs, onSnapshot, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCo8N5TfHzWq5PXELyTXoHb_SrzikweBwo",
            authDomain: "minor-project-a5077.firebaseapp.com",
            projectId: "minor-project-a5077",
            storageBucket: "minor-project-a5077.firebasestorage.app",
            messagingSenderId: "525600101149",
            appId: "1:525600101149:web:f98570a47b3e6e582047f4"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const loginBtn = document.querySelector('.btn-login');
        const signupBtn = document.querySelector('.btn-signup');

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                // Verify Role
                let finalName = user.displayName ? user.displayName.split(' ')[0] : user.email.split('@')[0];
                try {
                    const userDoc = await getDoc(doc(db, 'users', user.uid));
                    if (userDoc.exists()) {
                        const userData = userDoc.data();
                        if (userData.role !== 'organizer') {
                            alert("Access Denied: Only organizers can view the dashboard.");
                            window.location.href = 'index.html';
                            return;
                        }
                        const n = userData.username || userData.displayName || userData.organizerName || userData.fullName || finalName;
                        finalName = n.split(' ')[0];
                    } else {
                        alert("Access Denied: Organizer profile not found.");
                        window.location.href = 'index.html';
                        return;
                    }
                } catch (error) {
                    console.error("Error verifying role:", error);
                    window.location.href = 'index.html';
                    return;
                }

                // Logged In (Authorized Organizer)
                if (loginBtn) {
                    loginBtn.textContent = `Hi, ${finalName}`;
                    loginBtn.onclick = () => { window.location.href = 'profile.html'; };
                }
                if (signupBtn) {
                    signupBtn.textContent = "Sign Out";
                    signupBtn.onclick = () => {
                        signOut(auth).then(() => window.location.href = 'index.html');
                    };
                }

                // Load Dashboard Data
                loadDashboardData(user.uid);
            } else {
                // Not Logged In
                alert("Please log in as an organizer to view the dashboard.");
                window.location.href = 'index.html';
            }
        });

        function loadDashboardData(uid) {
            try {
                const eventsRef = collection(db, 'events');
                const q = query(eventsRef, where('organizerId', '==', uid));

                // Use onSnapshot for real-time updates
                onSnapshot(q, (snapshot) => {
                    let totalEvents = 0;
                    let totalParticipants = 0;
                    let totalRevenue = 0;
                    let totalClicks = 0;

                    const eventsContainer = document.getElementById('events-container');
                    eventsContainer.innerHTML = '';

                    if (snapshot.empty) {
                        eventsContainer.innerHTML = '<div style="text-align:center; padding: 20px; color:#71717a">No events found. Click "Create New Event" to get started!</div>';
                    }

                    snapshot.forEach(doc => {
                        const data = doc.data();
                        totalEvents += 1;
                        totalParticipants += (data.participants || 0);
                        totalRevenue += (data.revenue || 0);
                        totalClicks += (data.clicks || 0);

                        const dateStr = data.createdAt ? new Date(data.createdAt.toDate()).toLocaleDateString('en-US', { month: 'short', day: '2-digit', year: 'numeric' }) : 'Unknown Date';

                        const eventHTML = `
                            <div class="event-item">
                                <div class="event-info">
                                    <div class="status-dot dot-green"></div>
                                    <div class="event-details">
                                        <h4>${data.name || data.title || 'Untitled Event'}</h4>
                                        <div>Created ${dateStr}</div>
                                    </div>
                                </div>
                                <div class="event-stats">
                                    <div class="progress-wrapper">
                                        <div class="progress-text">${data.participants || 0}</div>
                                        <div class="progress-label">Participants</div>
                                    </div>
                                    <div style="margin: 0 15px; text-align:center;">
                                        <div class="progress-text" style="color:#a1a1aa; font-weight:600;">${data.clicks || 0}</div>
                                        <div class="progress-label">Clicks</div>
                                    </div>
                                    <button class="btn-manage" onclick="window.location.href='event-details.html?id=${doc.id}'">View</button>
                                </div>
                            </div>
                        `;
                        eventsContainer.insertAdjacentHTML('beforeend', eventHTML);
                    });

                    // Update Stats in real-time
                    document.getElementById('stat-events').innerText = totalEvents;
                    document.getElementById('stat-participants').innerText = totalParticipants;
                    document.getElementById('stat-revenue').innerText = '₹' + totalRevenue;
                    document.getElementById('stat-clicks').innerText = totalClicks;
                });

            } catch (error) {
                console.error("Error loading dashboard data:", error);
                document.getElementById('events-container').innerHTML = '<div style="color: #ef4444; padding: 20px;">Failed to load events.</div>';
            }
        }
    </script>

    <script>
        // Toggle Modal Visibility
        function toggleModal() {
            const modal = document.getElementById('create-modal');
            const btn = document.getElementById('create-btn');

            if (modal.classList.contains('hidden')) {
                modal.classList.remove('hidden');
                btn.innerText = 'Cancel';
            } else {
                modal.classList.add('hidden');
                btn.innerText = 'Create New Event';
            }
        }

        // Check if Magic Fill should be enabled
        function checkMagicFill() {
            const title = document.getElementById('event-title').value;
            const sport = document.getElementById('event-sport').value;
            const btn = document.getElementById('magic-fill-btn');

            if (title && sport) {
                btn.disabled = false;
            } else {
                btn.disabled = true;
            }
        }

        // Simulate AI Generation
        function handleMagicFill() {
            const btn = document.getElementById('magic-fill-btn');
            const icon = document.getElementById('magic-icon');
            const textarea = document.getElementById('event-desc');
            const title = document.getElementById('event-title').value;
            const sport = document.getElementById('event-sport').value;

            // Set Loading State
            btn.disabled = true;
            icon.innerText = '[Loading...]'; // Text placeholder update

            // Simulate API Delay
            setTimeout(() => {
                // Mock Response
                textarea.value = `Join us for the ultimate ${title}! Competitors from across the region will gather to showcase their skills in ${sport}. This event features a round-robin group stage followed by single-elimination playoffs. \n\nEntry fee includes a jersey and lunch. Spectators welcome!`;

                // Reset State
                icon.innerText = '[Sparkles]';
                btn.disabled = false;
            }, 1500);
        }
    </script>
</body>

</html>
