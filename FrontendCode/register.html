<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Registration - Athly</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>

    <style>
        :root {
            --bg-body: #09090b;
            --bg-card: #18181b;
            --border-color: #27272a;
            --text-primary: #fafafa;
            --text-secondary: #a1a1aa;
            --accent: #60a5fa;
            --font-main: 'Inter', sans-serif;
            --max-width: 600px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-primary);
            font-family: var(--font-main);
            line-height: 1.5;
            min-height: 100vh;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        /* --- Nav --- */
        nav {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 50;
            border-bottom: 1px solid var(--border-color);
            background-color: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(12px);
            height: 64px;
        }

        .container {
            max-width: 1280px;
            margin: 0 auto;
            padding: 0 1.5rem;
        }

        .nav-inner {
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 100%;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-weight: 700;
            font-size: 1.125rem;
            color: white;
        }

        .logo-dot {
            width: 12px;
            height: 12px;
            background-color: var(--text-primary);
            border-radius: 50%;
        }

        .nav-links {
            display: flex;
            gap: 2rem;
            font-size: 0.875rem;
            font-weight: 500;
            color: var(--text-secondary);
        }

        .nav-links a:hover {
            color: white;
        }

        /* --- Main Content --- */
        .main-wrapper {
            max-width: var(--max-width);
            margin: 0 auto;
            padding: 6rem 1.5rem 4rem 1.5rem;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            color: var(--text-secondary);
            font-size: 0.875rem;
            margin-bottom: 2rem;
            transition: color 0.2s;
        }

        .back-link:hover {
            color: white;
        }

        h1 {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 0.25rem;
        }

        h2 {
            font-size: 1.25rem;
            color: var(--accent);
            margin-bottom: 2rem;
            font-weight: 500;
        }

        /* Forms */
        .form-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 2rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .form-label {
            font-size: 0.875rem;
            font-weight: 600;
            color: var(--text-primary);
        }

        .form-input,
        .form-select {
            background-color: var(--bg-body);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 0.75rem 1rem;
            border-radius: 8px;
            font-size: 0.875rem;
            font-family: inherit;
            width: 100%;
            transition: border-color 0.2s;
        }

        .form-input:focus,
        .form-select:focus {
            outline: none;
            border-color: #52525b;
        }

        .btn-submit {
            display: block;
            width: 100%;
            background-color: white;
            color: black;
            padding: 1rem;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 2rem;
        }

        .btn-submit:hover {
            background-color: #e4e4e7;
        }

        .btn-submit:disabled {
            background-color: #71717a;
            color: #d4d4d8;
            cursor: not-allowed;
        }

        .alert {
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1.5rem;
            font-weight: 500;
            font-size: 0.875rem;
            display: none;
        }

        .alert-error {
            background-color: rgba(239, 68, 68, 0.1);
            color: #ef4444;
            border: 1px solid rgba(239, 68, 68, 0.2);
        }

        .alert-success {
            background-color: rgba(34, 197, 94, 0.1);
            color: #22c55e;
            border: 1px solid rgba(34, 197, 94, 0.2);
        }

        /* --- Payment Badge --- */
        .payment-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            font-size: 0.875rem;
            font-weight: 600;
            margin-bottom: 2rem;
        }

        .payment-badge.paid {
            background-color: rgba(34, 197, 94, 0.1);
            color: #4ade80;
            border: 1px solid rgba(34, 197, 94, 0.2);
        }

        .payment-badge.free {
            background-color: rgba(96, 165, 250, 0.1);
            color: #60a5fa;
            border: 1px solid rgba(96, 165, 250, 0.2);
        }

        /* --- Ticket Card --- */
        .ticket-card {
            background: linear-gradient(135deg, #18181b 0%, #1e1e22 100%);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 2rem;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .ticket-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, #60a5fa, #818cf8, #a78bfa);
        }

        .ticket-header {
            margin-bottom: 1.5rem;
        }

        .ticket-header h2 {
            font-size: 1.5rem;
            color: var(--text-primary);
            margin-bottom: 0.25rem;
        }

        .ticket-header p {
            color: var(--text-secondary);
            font-size: 0.875rem;
        }

        .ticket-qr {
            background: white;
            padding: 1rem;
            border-radius: 12px;
            display: inline-block;
            margin: 1.5rem 0;
        }

        .ticket-qr canvas,
        .ticket-qr img {
            display: block;
        }

        .ticket-id {
            font-family: 'Courier New', monospace;
            font-size: 1.125rem;
            font-weight: 700;
            color: #a78bfa;
            letter-spacing: 0.1em;
            margin-bottom: 1.5rem;
        }

        .ticket-details {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            text-align: left;
            margin-bottom: 1.5rem;
            padding: 1rem;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 8px;
        }

        .ticket-detail-item {
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
        }

        .ticket-detail-label {
            font-size: 0.75rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .ticket-detail-value {
            font-size: 0.875rem;
            font-weight: 600;
            color: var(--text-primary);
        }

        .ticket-actions {
            display: flex;
            gap: 1rem;
            margin-top: 1rem;
        }

        .ticket-actions button {
            flex: 1;
            padding: 0.75rem;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.875rem;
            cursor: pointer;
            border: none;
            transition: all 0.2s;
        }

        .btn-download {
            background-color: white;
            color: black;
        }

        .btn-download:hover {
            background-color: #e4e4e7;
        }

        .btn-go-back {
            background-color: transparent;
            color: var(--text-secondary);
            border: 1px solid var(--border-color) !important;
        }

        .btn-go-back:hover {
            color: white;
            border-color: #52525b !important;
        }

        .divider {
            border: none;
            border-top: 1px dashed var(--border-color);
            margin: 1.5rem 0;
        }

        .email-status {
            font-size: 0.8rem;
            color: var(--text-secondary);
            margin-top: 0.75rem;
        }

        .email-status.sent {
            color: #4ade80;
        }

        .email-status.failed {
            color: #ef4444;
        }
    </style>
</head>

<body>
    <nav>
        <div class="container nav-inner">
            <a href="index.html" class="logo">
                <div class="logo-dot"></div>
                <span>Athly</span>
            </a>
            <div class="nav-links">
                <a href="events.html">Discover</a>
                <a href="community.html">Community</a>
            </div>
            <div style="width: 64px;"></div> <!-- Spacer -->
        </div>
    </nav>

    <div class="main-wrapper">
        <a id="back-btn" href="events.html" class="back-link">
            &larr; Back to Event
        </a>

        <h1>Athlete Registration</h1>
        <h2 id="event-name-display">Loading Event...</h2>

        <!-- Payment badge -->
        <div id="payment-badge" style="display: none;"></div>

        <div id="alert-error" class="alert alert-error">An error occurred.</div>
        <div id="alert-success" class="alert alert-success">Registration successful!</div>

        <!-- Registration Form -->
        <div class="form-card" id="registration-form-card">
            <form id="registration-form">
                <div class="form-group">
                    <label class="form-label" for="reg-name">Full Name *</label>
                    <input type="text" id="reg-name" class="form-input" required placeholder="John Doe">
                </div>

                <div class="form-group">
                    <label class="form-label" for="reg-email">Contact Email *</label>
                    <input type="email" id="reg-email" class="form-input" required placeholder="john@example.com">
                </div>

                <div style="display: flex; gap: 1rem;">
                    <div class="form-group" style="flex: 1;">
                        <label class="form-label" for="reg-age">Age *</label>
                        <input type="number" id="reg-age" class="form-input" required min="10" max="100"
                            placeholder="25">
                    </div>

                    <div class="form-group" style="flex: 1;">
                        <label class="form-label" for="reg-gender">Gender *</label>
                        <select id="reg-gender" class="form-select" required style="color-scheme: dark;">
                            <option value="" disabled selected>Select</option>
                            <option value="Male">Male</option>
                            <option value="Female">Female</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="reg-phone">Phone Number *</label>
                    <input type="tel" id="reg-phone" class="form-input" required placeholder="+1 234 567 8900">
                </div>

                <div class="form-group">
                    <label class="form-label" for="reg-emergency">Emergency Contact (Name & Number) *</label>
                    <input type="text" id="reg-emergency" class="form-input" required
                        placeholder="Jane Doe: +1 987 654 3210">
                </div>

                <button type="submit" id="submit-btn" class="btn-submit">Complete Registration</button>
            </form>
        </div>

        <!-- Ticket Card (hidden until registration completes) -->
        <div id="ticket-card" class="ticket-card" style="display: none;">
            <div class="ticket-header">
                <h2>🎟️ Registration Confirmed!</h2>
                <p>Your ticket for the event</p>
            </div>

            <div class="ticket-qr" id="ticket-qr-container">
                <!-- QR code will be rendered here -->
            </div>

            <div class="ticket-id" id="ticket-id-display">ATHLY-XXXX-XXXX</div>

            <hr class="divider">

            <div class="ticket-details">
                <div class="ticket-detail-item">
                    <span class="ticket-detail-label">Event</span>
                    <span class="ticket-detail-value" id="ticket-event-name">—</span>
                </div>
                <div class="ticket-detail-item">
                    <span class="ticket-detail-label">Athlete</span>
                    <span class="ticket-detail-value" id="ticket-athlete-name">—</span>
                </div>
                <div class="ticket-detail-item">
                    <span class="ticket-detail-label">Date</span>
                    <span class="ticket-detail-value" id="ticket-event-date">—</span>
                </div>
                <div class="ticket-detail-item">
                    <span class="ticket-detail-label">Payment</span>
                    <span class="ticket-detail-value" id="ticket-payment-status">—</span>
                </div>
            </div>

            <div class="email-status" id="email-status">📧 Sending confirmation email...</div>

            <div class="ticket-actions">
                <button class="btn-download" id="btn-download-ticket">⬇ Download Ticket</button>
                <button class="btn-go-back" id="btn-go-events">← Back to Events</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc, updateDoc, increment, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // Config
        const firebaseConfig = {
            apiKey: "AIzaSyCo8N5TfHzWq5PXELyTXoHb_SrzikweBwo",
            authDomain: "minor-project-a5077.firebaseapp.com",
            projectId: "minor-project-a5077",
            storageBucket: "minor-project-a5077.firebasestorage.app",
            messagingSenderId: "525600101149",
            appId: "1:525600101149:web:f98570a47b3e6e582047f4"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        // ============================================
        //  EmailJS Config (Replace with your own keys)
        // ============================================
        const EMAILJS_PUBLIC_KEY = 'nYA2vge7ruDgWhodg';   // TODO: Replace
        const EMAILJS_SERVICE_ID = 'service_kzajpvr';   // TODO: Replace
        const EMAILJS_TEMPLATE_ID = 'template_4xl1gsg'; // TODO: Replace

        // Initialize EmailJS
        try {
            emailjs.init(EMAILJS_PUBLIC_KEY);
        } catch (e) {
            console.warn('EmailJS not initialized:', e);
        }

        // Core UI Hooks
        const titleDisplay = document.getElementById('event-name-display');
        const backBtn = document.getElementById('back-btn');
        const form = document.getElementById('registration-form');
        const formCard = document.getElementById('registration-form-card');
        const submitBtn = document.getElementById('submit-btn');
        const alertSuccess = document.getElementById('alert-success');
        const alertError = document.getElementById('alert-error');
        const paymentBadge = document.getElementById('payment-badge');

        // State variables
        let eventId = null;
        let paymentId = null;
        let isFreeEvent = false;
        let currentUser = null;
        let eventData = null;

        // Init
        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            eventId = urlParams.get('id');
            paymentId = urlParams.get('paymentId');
            isFreeEvent = urlParams.get('free') === 'true';

            if (!eventId) {
                alert("Invalid event link.");
                window.location.href = 'events.html';
                return;
            }

            // Validate: must have either paymentId or free flag
            if (!paymentId && !isFreeEvent) {
                alert("Payment required. Please register through the event page.");
                window.location.href = `event-details.html?id=${eventId}`;
                return;
            }

            // Show payment badge
            if (paymentId) {
                paymentBadge.className = 'payment-badge paid';
                paymentBadge.innerHTML = `✓ Payment Verified — ${paymentId}`;
                paymentBadge.style.display = 'inline-flex';
            } else if (isFreeEvent) {
                paymentBadge.className = 'payment-badge free';
                paymentBadge.innerHTML = '✓ Free Event — No Payment Required';
                paymentBadge.style.display = 'inline-flex';
            }

            backBtn.href = `event-details.html?id=${eventId}`;
            fetchEventDetails();
        });

        async function fetchEventDetails() {
            try {
                const eventSnap = await getDoc(doc(db, 'events', eventId));
                if (eventSnap.exists()) {
                    eventData = eventSnap.data();
                    titleDisplay.textContent = eventData.name || eventData.title || 'Untitled Event';
                } else {
                    titleDisplay.textContent = "Event Not Found";
                    form.style.display = 'none';
                }
            } catch (err) {
                console.error(err);
                titleDisplay.textContent = "Error Loading Event";
            }
        }

        // Auth Check (Strictly Athletes)
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                try {
                    const userDoc = await getDoc(doc(db, 'users', user.uid));
                    if (userDoc.exists() && userDoc.data().role === 'athlete') {
                        currentUser = user;
                        // Pre-fill email and name from auth if available
                        document.getElementById('reg-email').value = user.email || '';
                        document.getElementById('reg-name').value = user.displayName || '';
                    } else {
                        alert("Access Denied: Only athletes can register for events.");
                        window.location.href = `event-details.html?id=${eventId}`;
                    }
                } catch (error) {
                    console.error("error:", error);
                }
            } else {
                alert("Please log in as an Athlete to register.");
                window.location.href = 'login.html';
            }
        });

        // Generate Ticket ID
        function generateTicketId() {
            const prefix = 'ATHLY';
            const eventPart = eventId ? eventId.slice(0, 4).toUpperCase() : 'XXXX';
            const timePart = Date.now().toString(36).toUpperCase().slice(-4);
            const randPart = Math.random().toString(36).substring(2, 6).toUpperCase();
            return `${prefix}-${eventPart}-${timePart}-${randPart}`;
        }

        // Submission
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            if (!currentUser || !eventId) return;

            submitBtn.disabled = true;
            submitBtn.textContent = 'Processing...';
            alertError.style.display = 'none';
            alertSuccess.style.display = 'none';

            const ticketId = generateTicketId();

            const payload = {
                name: document.getElementById('reg-name').value.trim(),
                email: document.getElementById('reg-email').value.trim(),
                age: document.getElementById('reg-age').value,
                gender: document.getElementById('reg-gender').value,
                phone: document.getElementById('reg-phone').value.trim(),
                emergencyContact: document.getElementById('reg-emergency').value.trim(),
                registeredAt: serverTimestamp(),
                userId: currentUser.uid,
                eventId: eventId,
                ticketId: ticketId,
                paymentId: paymentId || null,
                paymentStatus: paymentId ? 'paid' : 'free'
            };

            try {
                // 1. Save Registration Data
                const regDocId = `${eventId}_${currentUser.uid}`;
                await setDoc(doc(db, 'registrations', regDocId), payload);

                // 2. Increment participant count on the source event
                await updateDoc(doc(db, 'events', eventId), {
                    participants: increment(1)
                });

                // 3. Show ticket
                showTicket(ticketId, payload);

                // 4. Send confirmation email (non-blocking)
                sendConfirmationEmail(payload, ticketId);

            } catch (err) {
                console.error("Registration Error:", err);
                alertError.textContent = "Error completing registration. You may already be registered.";
                alertError.style.display = 'block';
                submitBtn.disabled = false;
                submitBtn.textContent = 'Complete Registration';
            }
        });

        // Show Ticket with QR Code
        async function showTicket(ticketId, registrationData) {
            // Hide form, show ticket
            formCard.style.display = 'none';
            alertSuccess.style.display = 'none';
            alertError.style.display = 'none';
            paymentBadge.style.display = 'none';
            document.querySelector('h1').textContent = 'Your Ticket';
            titleDisplay.style.display = 'none';

            const ticketCard = document.getElementById('ticket-card');
            ticketCard.style.display = 'block';

            // Populate ticket details
            document.getElementById('ticket-id-display').textContent = ticketId;
            document.getElementById('ticket-event-name').textContent = eventData?.name || eventData?.title || 'Event';
            document.getElementById('ticket-athlete-name').textContent = registrationData.name;
            document.getElementById('ticket-payment-status').textContent = paymentId ? `Paid (${paymentId.slice(0, 12)}...)` : 'Free';

            // Format event date
            if (eventData?.date) {
                try {
                    const d = new Date(eventData.date);
                    if (!isNaN(d.getTime())) {
                        document.getElementById('ticket-event-date').textContent =
                            d.toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });
                    } else {
                        document.getElementById('ticket-event-date').textContent = eventData.date;
                    }
                } catch (e) {
                    document.getElementById('ticket-event-date').textContent = eventData.date || 'TBD';
                }
            } else {
                document.getElementById('ticket-event-date').textContent = 'TBD';
            }

            // Generate QR Code
            const qrContainer = document.getElementById('ticket-qr-container');
            try {
                const qrData = JSON.stringify({
                    ticketId: ticketId,
                    eventId: eventId,
                    athleteName: registrationData.name,
                    paymentId: paymentId || 'free'
                });
                new QRCode(qrContainer, {
                    text: qrData,
                    width: 200,
                    height: 200,
                    colorDark: '#09090b',
                    colorLight: '#ffffff',
                    correctLevel: QRCode.CorrectLevel.M
                });
            } catch (err) {
                console.error('QR Code error:', err);
                qrContainer.innerHTML = '<p style="color: #ef4444; padding: 2rem;">Could not generate QR code</p>';
            }

            // Download ticket button
            document.getElementById('btn-download-ticket').addEventListener('click', () => {
                downloadTicket(ticketId);
            });

            // Back to events button
            document.getElementById('btn-go-events').addEventListener('click', () => {
                window.location.href = `event-details.html?id=${eventId}`;
            });
        }

        // Download Ticket as Image
        function downloadTicket(ticketId) {
            const canvas = document.querySelector('#ticket-qr-container canvas');
            if (canvas) {
                const link = document.createElement('a');
                link.download = `athly-ticket-${ticketId}.png`;
                link.href = canvas.toDataURL('image/png');
                link.click();
            }
        }

        // Send Confirmation Email via EmailJS
        async function sendConfirmationEmail(registrationData, ticketId) {
            const emailStatusEl = document.getElementById('email-status');

            // Check if EmailJS is configured
            if (EMAILJS_PUBLIC_KEY === 'YOUR_EMAILJS_PUBLIC_KEY') {
                emailStatusEl.textContent = '📧 Email service not configured yet. Configure EmailJS to enable emails.';
                emailStatusEl.className = 'email-status';
                return;
            }

            try {
                // Format location
                let location = 'TBD';
                if (eventData) {
                    let parts = [];
                    if (eventData.location) parts.push(eventData.location);
                    if (eventData.city) parts.push(eventData.city);
                    if (eventData.state) parts.push(eventData.state);
                    if (parts.length > 0) location = parts.join(', ');
                }

                const templateParams = {
                    to_email: registrationData.email,
                    to_name: registrationData.name,
                    event_name: eventData?.name || eventData?.title || 'Event',
                    ticket_id: ticketId,
                    event_date: eventData?.date || 'TBD',
                    event_location: location,
                    payment_id: paymentId || 'Free Event'
                };

                await emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, templateParams);
                emailStatusEl.textContent = '✓ Confirmation email sent successfully!';
                emailStatusEl.className = 'email-status sent';
            } catch (err) {
                console.error('Email error:', err);
                emailStatusEl.textContent = '⚠ Could not send confirmation email. Your registration is still valid.';
                emailStatusEl.className = 'email-status failed';
            }
        }

    </script>
</body>

</html>
